name: Update Flyway README Version

permissions: {}

on:
  push:
    tags:
      - 'flyway/v*'

jobs:
  update-readme:
    name: Update README version references
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: |
          # Tag format: flyway/v1.0.1 -> version: 1.0.1
          VERSION="${GITHUB_REF_NAME#flyway/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Update version references in README
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          README="flyway/README.md"

          # Update Maven dependency version
          sed -i -E "/<artifactId>aurora-dsql-flyway-support<\\/artifactId>/{n;s|<version>[^<]+</version>|<version>${VERSION}</version>|;}" "$README"

          # Update Gradle dependency version
          sed -i -E "s|(implementation 'software\.amazon\.dsql:aurora-dsql-flyway-support:)[^']+(')|\\1${VERSION}\\2|g" "$README"

          # Update build output jar reference
          sed -i -E "s|(aurora-dsql-flyway-support-)[0-9]+\.[0-9]+\.[0-9]+(\.jar)|\1${VERSION}\2|g" "$README"

          echo "Updated README to version $VERSION"
          git diff "$README"

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="automation/flyway-readme-v${VERSION}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet flyway/README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git switch -c "$BRANCH"
          git add flyway/README.md
          git commit -m "Update flyway README version references to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update Flyway README to ${VERSION}" \
            --body "Updates Flyway README version references after the ${VERSION} release."
