name: Flyway Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'flyway/v*'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Maven Central deployment stage'
        required: true
        type: choice
        options:
          - FULL
          - PUBLISH
      deploymentId:
        description: 'Deployment ID required for PUBLISH'
        required: false
        type: string

defaults:
  run:
    working-directory: flyway

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: maven
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build release artifacts
        if: github.event_name == 'push' || inputs.stage == 'FULL'
        run: |
          ./gradlew build
          ./gradlew publish

      - name: Deploy to Central Portal
        run: |
          ./gradlew jreleaserDeploy
        env:
          JRELEASER_MAVENCENTRAL_STAGE: ${{ inputs.stage || 'FULL' }}
          JRELEASER_MAVENCENTRAL_DEPLOYMENT_ID: ${{ inputs.deploymentId }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
