name: Flyway Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'flyway/v*'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Maven Central deployment stage'
        required: true
        type: choice
        options:
          - FULL
          - PUBLISH
      deploymentId:
        description: 'Deployment ID required for PUBLISH'
        required: false
        type: string

defaults:
  run:
    working-directory: flyway

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Assert tag version matches Gradle project
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#flyway/v}"
          project_version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          test "$tag_version" = "$project_version" || {
            echo "Tag version $tag_version does not match project version $project_version"
            exit 1
          }

  deploy:
    needs: verify-version
    runs-on: ubuntu-latest
    environment: maven
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build release artifacts
        if: github.event_name == 'push' || inputs.stage == 'FULL'
        run: |
          ./gradlew clean build
          ./gradlew publish

      - name: Deploy to Central Portal
        run: ./gradlew jreleaserDeploy
        env:
          JRELEASER_MAVENCENTRAL_STAGE: ${{ inputs.stage || 'FULL' }}
          JRELEASER_MAVENCENTRAL_DEPLOYMENT_ID: ${{ inputs.deploymentId }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GIT_ROOT_SEARCH: 'true'
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
