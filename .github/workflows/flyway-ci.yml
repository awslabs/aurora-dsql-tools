name: Flyway CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      run-integration:
        description: "Allow jobs that use AWS credentials"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'flyway/**'
      - '.github/workflows/flyway-ci.yml'
      - '.github/workflows/dsql-cluster-*.yml'

defaults:
  run:
    working-directory: flyway

jobs:
  build:
    name: Build and Unit Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up compile JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up test JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java-version }}

  create-cluster:
    if: github.event_name != 'pull_request' || inputs.run-integration
    needs: build
    uses: ./.github/workflows/dsql-cluster-create.yml
    with:
      workflow_name: flyway
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write

  integration-test:
    needs: create-cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ needs.create-cluster.outputs.region }}

      - name: Run integration tests
        env:
          DSQL_CLUSTER_ENDPOINT: ${{ needs.create-cluster.outputs.cluster-endpoint }}
          AWS_REGION: ${{ needs.create-cluster.outputs.region }}
        run: ./gradlew integrationTest

  delete-cluster:
    if: always() && needs.create-cluster.result == 'success'
    needs: [create-cluster, integration-test]
    uses: ./.github/workflows/dsql-cluster-delete.yml
    with:
      cluster-id: ${{ needs.create-cluster.outputs.cluster-id }}
      region: ${{ needs.create-cluster.outputs.region }}
    secrets:
      IAM_ROLE: ${{ secrets.IAM_ROLE }}
    permissions:
      id-token: write
