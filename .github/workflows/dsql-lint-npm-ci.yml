name: dsql-lint npm CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - 'dsql-lint/npm/**'
      - '.github/workflows/dsql-lint-npm-*.yml'

jobs:
  wrapper-tests:
    name: Wrapper tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run wrapper unit tests
        run: node --test dsql-lint/npm/dsql-lint/test/wrapper.test.js

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/dsql-lint-*.yml
