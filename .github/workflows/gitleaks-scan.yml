name: Gitleaks scan

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Scan with Gitleaks
        run: |
          args=(git --verbose --redact --no-banner /repo)
          if [[ -f "$GITHUB_WORKSPACE/.github/.gitleaks.toml" ]]; then
            args+=(--config=/repo/.github/.gitleaks.toml)
          fi
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.30.1 \
            "${args[@]}"
